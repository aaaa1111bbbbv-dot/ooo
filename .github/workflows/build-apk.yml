name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Kutubxonalarni o'rnatish
        run: npm install

      - name: PeerJS ni lokal nusxalash
        run: cp node_modules/peerjs/dist/peerjs.min.js www/peerjs.min.js

      - name: Android loyihasini yaratish
        run: npx cap add android

      - name: Mikrofon ruxsatlarini qo'shish
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Sinxronlash
        run: npx cap sync android

      - name: APK yig'ish
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ratsiya-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
